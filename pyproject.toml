[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arkts-smell-refactor"
version = "0.1.0"
description = "Dataset-driven ArkTS code-smell refactoring orchestrator"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
arkts-refactor = "arkts_smell_refactor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

